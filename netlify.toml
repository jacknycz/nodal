[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle Supabase auth redirects
[[redirects]]
  from = "/auth/callback"
  to = "/index.html"
  status = 200

# Handle any other auth-related redirects
[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200
